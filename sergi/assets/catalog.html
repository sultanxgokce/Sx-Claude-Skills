<!doctype html>
<html lang="@@LANG@@">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>@@TITLE@@</title>
<style>
:root{--ink:#182c27;--green:#143c37;--paper:#f4f3ef;--muted:#576860;--line:#dce1d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:var(--green);color:#fff;padding:48px 6vw 36px}.eyebrow{color:#bae0a3;font-size:12px;letter-spacing:3px;text-transform:uppercase}h1{font-size:clamp(32px,4.5vw,58px);line-height:1.1;letter-spacing:-1.8px;margin:18px 0;max-width:1000px}header p{color:#d8e7df;max-width:780px}.stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:28px}.stats b{font-size:27px;margin-right:6px}.toolbar{padding:20px 6vw;position:sticky;top:0;background:#f4f3eff5;backdrop-filter:blur(10px);z-index:2;border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}input,select,button{font:inherit;color:inherit;border:1px solid #c9d3c9;background:white;border-radius:8px;padding:10px 12px}input{flex:1;min-width:180px}select{max-width:100%}button,a{touch-action:manipulation}button{cursor:pointer}button:hover,.action:hover{border-color:#36745c}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #538568;outline-offset:3px}main{padding:24px 6vw 50px}#count{margin:0 0 22px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}.card{display:flex;flex-direction:column;background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.preview{height:220px;background:#e7ebe4;padding:16px;display:flex;align-items:center;justify-content:center;border:0;border-radius:0;width:100%;overflow:hidden}.preview img{max-height:100%;max-width:100%;object-fit:contain;box-shadow:0 3px 14px #18302418}.placeholder{display:flex;flex-direction:column;align-items:center;gap:9px;color:#556d5a;font-size:13px}.placeholder strong{font-size:36px;font-weight:500;letter-spacing:-2px}.body{padding:20px;display:flex;flex-direction:column;flex:1}.tag{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}.card h2{font-size:20px;line-height:1.3;margin:9px 0;overflow-wrap:anywhere}.note{color:var(--muted);font-size:14px;margin:3px 0 18px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}.action{border:1px solid #cbd8ce;border-radius:6px;padding:7px 11px;font-size:13px;font-weight:600;text-decoration:none;color:var(--green);display:inline-block}.primary{background:var(--green);color:white}.empty{padding:60px 20px;text-align:center;border:1px dashed #bcc9bd;border-radius:14px}footer{border-top:1px solid var(--line);padding:24px 6vw;color:var(--muted);font-size:13px}dialog{border:1px solid var(--line);border-radius:16px;max-width:840px;width:calc(100% - 32px);max-height:90vh;padding:28px;overflow:auto;color:var(--ink)}dialog::backdrop{background:#0c2724a8}dialog h2{font-size:28px;line-height:1.2;padding-right:30px}dialog img{display:block;max-width:100%;max-height:48vh;margin:20px auto;object-fit:contain}dialog p{white-space:pre-wrap;overflow-wrap:anywhere}.close{position:absolute;right:16px;top:16px}.meta{font-size:13px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:600px){header{padding:32px 6vw}.toolbar{position:static}.toolbar input{flex-basis:100%}.toolbar select{flex:1;min-width:120px}.grid{grid-template-columns:1fr}.stats{gap:16px}.stats b{font-size:24px}.preview{height:210px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header><div class="eyebrow" id="brand"></div><h1 id="title"></h1><p id="subtitle"></p><div class="stats" id="stats"></div></header>
<div class="toolbar"><input id="search" type="search"><select id="category"></select><select id="kind"></select><select id="sort"></select><button id="reset" type="button"></button></div>
<main><p id="count" role="status" aria-live="polite"></p><div class="grid" id="grid"></div><div class="empty" id="empty" hidden></div><noscript>JavaScript kapalı. / JavaScript is disabled. @@FALLBACK@@</noscript></main>
<footer id="footer"></footer><dialog id="detail" aria-labelledby="detail-title"><button class="close" id="close" type="button">✕</button><div id="detail-body"></div></dialog>
<script type="application/json" id="catalog-data">@@DATA@@</script>
<script>
'use strict';
const data=JSON.parse(document.querySelector('#catalog-data').textContent),tr=data.language==='tr';
const words=tr?{brand:'SEÇİLMİŞ KAYNAKLAR / GÖRSEL KÜTÜPHANE',records:'kayıt',categories:'kategori',files:'yerel dosya',search:'Başlık, açıklama veya etiket ara…',category:'Tüm kategoriler',kind:'Tüm türler',reset:'Temizle',order:'Koleksiyon sırası',az:'Başlık A–Z',newest:'En yeni tarih',shown:'kayıt gösteriliyor',empty:'Eşleşen kayıt yok. Aramayı veya filtreleri değiştirin.',detail:'İncele',file:'Dosyayı aç',source:'Kaynak ↗',preview:'Önizlemeyi aç',missing:'Önizleme eklenmemiş',close:'Kapat',date:'İçerik tarihi',license:'Lisans',language:'İçerik dili',tags:'Etiketler',footer:'Yerel katalog • Kaynak bağlantıları internet gerektirir.',archive:'Arşiv tarihi'}:{brand:'SELECTED RESOURCES / VISUAL LIBRARY',records:'records',categories:'categories',files:'local files',search:'Search titles, descriptions or tags…',category:'All categories',kind:'All types',reset:'Clear',order:'Collection order',az:'Title A–Z',newest:'Newest date',shown:'records shown',empty:'No matching records. Change your search or filters.',detail:'Explore',file:'Open file',source:'Source ↗',preview:'Open preview',missing:'No preview provided',close:'Close',date:'Content date',license:'License',language:'Content language',tags:'Tags',footer:'Local catalog • Source links require internet.',archive:'Archived'};
const $=s=>document.querySelector(s),locale=tr?'tr':'en';
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function option(select,value,label){const e=el('option',label);e.value=value;select.append(e)}
function link(label,href,primary=false){const a=el('a',label,'action'+(primary?' primary':''));a.href=href;a.target='_blank';a.rel='noopener noreferrer';return a}
function actions(x){const box=el('div',undefined,'actions');if(x.file)box.append(link(words.file,x.file,true));if(x.source_url)box.append(link(words.source,x.source_url));return box}
function preview(x){if(x.preview){const i=el('img');i.src=x.preview;i.alt=x.title;i.loading='lazy';return i}const b=el('div',undefined,'placeholder');b.append(el('strong',x.kind.slice(0,14)),el('span',words.missing));return b}
$('#brand').textContent=words.brand;$('#title').textContent=data.title;$('#subtitle').textContent=data.subtitle;document.title=data.title;
for(const [n,label] of [[data.items.length,words.records],[new Set(data.items.map(x=>x.category)).size,words.categories],[data.items.filter(x=>x.file).length,words.files]]){const s=el('span');s.append(el('b',String(n)),document.createTextNode(label));$('#stats').append(s)}
$('#search').placeholder=words.search;$('#search').setAttribute('aria-label',words.search);
for(const [id,key] of [['category','category'],['kind','kind']]){const select=$('#'+id);select.setAttribute('aria-label',words[key]);option(select,'',words[key]);[...new Set(data.items.map(x=>x[key]))].sort((a,b)=>a.localeCompare(b,locale)).forEach(x=>option(select,x,x))}
for(const [key,label] of [['order',words.order],['az',words.az],['newest',words.newest]])option($('#sort'),key,label);$('#sort').setAttribute('aria-label',tr?'Sıralama':'Sort');$('#reset').textContent=words.reset;$('#empty').textContent=words.empty;$('#close').setAttribute('aria-label',words.close);$('#footer').textContent=words.footer+(data.collected_at?' '+words.archive+': '+data.collected_at:'');
let opener;
function details(x,button){opener=button;const body=$('#detail-body');body.replaceChildren();const heading=el('h2',x.title);heading.id='detail-title';body.append(el('span',x.category+' / '+x.kind,'tag'),heading,preview(x),el('p',x.note));for(const key of ['date','license','language'])if(x[key])body.append(el('p',words[key]+': '+x[key],'meta'));if(x.tags.length)body.append(el('p',words.tags+': '+x.tags.join(' · '),'meta'));const aa=actions(x);if(x.preview)aa.append(link(words.preview,x.preview));body.append(aa);$('#detail').showModal()}
$('#close').onclick=()=>$('#detail').close();$('#detail').addEventListener('close',()=>{if(opener&&opener.isConnected)opener.focus()});$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
function render(){const q=$('#search').value.trim().toLocaleLowerCase(locale),cat=$('#category').value,kind=$('#kind').value;let list=data.items.filter(x=>(!cat||x.category===cat)&&(!kind||x.kind===kind)&&[x.title,x.note,x.category,x.kind,...x.tags].join(' ').toLocaleLowerCase(locale).includes(q));if($('#sort').value==='az')list.sort((a,b)=>a.title.localeCompare(b.title,locale));if($('#sort').value==='newest')list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));$('#grid').replaceChildren();const frag=document.createDocumentFragment();for(const x of list){const card=el('article',undefined,'card'),p=el('button',undefined,'preview');p.type='button';p.setAttribute('aria-label',x.title+' — '+words.detail);p.append(preview(x));p.onclick=()=>details(x,p);const body=el('div',undefined,'body');body.append(el('span',x.category+' · '+x.kind,'tag'),el('h2',x.title),el('p',x.note,'note'));const aa=actions(x),b=el('button',words.detail,'action');b.type='button';b.onclick=()=>details(x,b);aa.prepend(b);body.append(aa);card.append(p,body);frag.append(card)}$('#grid').append(frag);$('#count').textContent=list.length+' / '+data.items.length+' '+words.shown;$('#empty').hidden=list.length!==0}
$('#search').addEventListener('input',render);for(const id of ['category','kind','sort'])$('#'+id).addEventListener('change',render);$('#reset').onclick=()=>{$('#search').value='';$('#category').value='';$('#kind').value='';$('#sort').value='order';render();$('#search').focus()};render();
</script></body></html>
