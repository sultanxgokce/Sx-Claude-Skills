# Sx-Claude-Skills lint-gate (Federe Ekip-OS D6/C2 — repo'nun İLK CI'ı)
# NE: manifest-katmanı kapısı — catalog↔install↔targets parity (validate-repo --strict) +
#     install'lı her skill'in SKILL.md + version-frontmatter taşıdığı.
# NE-DEĞİL: canlı-makine drift'i (o evergreen-parity cron-gate'inin işi — CI canlıyı göremez);
#     sync-apply de KOŞULMAZ (dağıtım elle-disiplin, ahi/DOCTRINE §8).
name: sx-lint
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sx-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Parity · catalog ↔ sync-targets ↔ targets-varlığı (STRICT gate)"
        run: node ahi/schema/validate-repo.mjs . --strict
      - name: "Versiyon · install'lı her skill SKILL.md + semver-frontmatter taşır"
        run: node ahi/schema/version-lint.mjs .
      - name: "Motor · sync-skills.mjs sözdizimi"
        run: node --check sync-skills.mjs

      # Kapı sınavı: aşağıdaki keşif adımı "sınavlar geçiyor mu" diye sorar. Bu adım
      # onun SORMADIĞI üç soruyu sorar: kapı DEVREDE mi (çağıran var mı) · modül
      # ÇAĞRILABİLİR mi (içe aktarınca donuyor mu) · defter TUTARLI mı.
      # 🔴 `kos` bilerek KOŞULMAZ — keşif adımı zaten aynı dosyaları koşuyor; iki kez
      #    koşmak sıfır yeni bilgi için çift maliyettir.
      # 🔴 `bayat-mi` de bilerek KOŞULMAZ — CI her seferinde TEMİZ ortamda başlar, yani
      #    "son yeşil koşum" damgası hiç var olmaz ve kapı DAİMA "ölçemedim" der. Daima
      #    sarı yanan kapı ya her şeyi bloklar ya görmezden gelinir; ikisi de tiyatrodur.
      #    Bayatlık YEREL/İNSAN kapısıdır ("ben geldiğimde bu yeşil güncel miydi?").
      # RC=3 (ÖLÇÜLEMEDİ) bu adımı DÜŞÜRÜR — ölçemediğimiz kapı temiz sayılmaz.
      - name: "Kapı sınavı · devrede mi · çağrılabilir mi (ÖLÇÜLEMEDİ = kırmızı)"
        run: |
          set -uo pipefail
          A=kapi-sinavi/scripts/kapi-sinavi.sh
          dusen=0
          for k in kayit bagli-mi ithal; do
            echo "── $k"
            bash "$A" "$k"; rc=$?
            case "$rc" in
              0) echo "   ✓ $k" ;;
              3) echo "::error::$k ÖLÇÜLEMEDİ (rc=3) — bu YEŞİL DEĞİLDİR"; dusen=$((dusen+1)) ;;
              *) echo "::error::$k BULGU/HATA (rc=$rc)"; dusen=$((dusen+1)) ;;
            esac
          done
          [ "$dusen" -eq 0 ]

      # Kabuk-sınamaları: 2026-07-30'a kadar depoda 20 adet `*.test.sh` vardı ve HİÇBİRİ
      # bir kapıda koşmuyordu — yazılmış ama bağlanmamış koruma. (Aynı sınıf cloudtop'ta da
      # ölçüldü.) Liste TÜRETİLİR, elle sayılmaz: yeni bir sınama eklendiği anda bu kapı onu
      # kendiliğinden koşar; sıfır sınama bulmak KIRMIZI'dır (keşif bozulursa sessizce
      # "hepsi geçti" demesin).
      - name: "Kabuk sınamaları · her *.test.sh (liste türetilir, sıfır bulmak kırmızı)"
        run: |
          set -uo pipefail
          # KARANTİNA — kapı ilk kez kurulurken KIRMIZI bulunan, bu PR'ın konusuyla İLGİSİZ
          # sınamalar. Sessiz atlama YASAK: her atlanan satır aşağıda ADIYLA ve GEREKÇESİYLE
          # loglanır, sayısı basılır. Karantina boşaltmak ayrı iştir (bulgu kaydı açıldı).
          #   mucit-t1.test.sh — 4 kapı (G10/G11 kota-tavanı · G17b/G18 layiha-üretimi) YALNIZ
          #   GitHub runner'ında düşüyor; üç yerel yapılandırmada (worktree · temiz klon ·
          #   LC_ALL=C) 39/39 geçiyor. Ortam-farkı henüz izole edilmedi; L24 MUCİT paketinin
          #   kendi işi (üreten≠işleten) → burada bodoslama düzeltilmiyor.
          #   kasif-hafiza.test.sh — TAKVİMLE ÇÜRÜYEN SINAV (ölçüldü 2026-08-23, PR #206).
          #   Kimsenin değişikliğinden kırılmadı: dosyaya en son #72'de dokunuldu. Ölçtüğü araç
          #   (kasif-karne.sh:39) KAYAN 30 GÜNLÜK pencere kullanıyor — `date -u -d "-30 days"` —
          #   ama sınavın fikstürü SABİT tarihler yazıyor (2026-07-01 · 07-25 · 07-26). Fikstür
          #   pencerenin dışına düşünce araç karne yerine "Henüz karne verilemez" basıyor ve
          #   metrik satırlarını arayan 5 iddia birden düşüyor (15 geçen / 5 düşen).
          #   → Gerçek onarım: fikstür tarihleri GÖRECELİ olsun ("bugünden N gün önce").
          #     Sahibi KAŞİF/MUCİT hattı; burada bodoslama düzeltilmiyor (üreten≠işleten).
          #   ⚠️ Bu, "yeşilin ne zamanki veriye ait olduğu sorulmuyor" sınıfının bir vakasıdır —
          #     kapı-sinavi becerisinin `bayat-mi` kapısının fikstür tarafındaki karşılığı.
          #   compact.test.sh — K2 ('tur sırasında kuyruğa eklenen satır yeniden yazımda kaybolmaz') origin/main'de
          #   de KIRMIZI (ölçüldü 2026-10-17, yerel + CI #354/#360 koşumları); 0.5 sn gecikmeli eklenen satır kayboluyor.
          #   Gerçek yarış hatası mı zamanlama mı belirsiz → görev defterinde bulgu (sahip BÂNİ, kart compact-k2-yaris);
          #   bu PR'ların dosyası değil. Karantina = sessiz atlama DEĞİL: aşağıda adıyla loglanır, sayılır.
          KARANTINA=" ./mucit-suz/scripts/mucit-t1.test.sh ./kasif-tara/scripts/kasif-hafiza.test.sh ./terminal-onar/scripts/compact.test.sh "
          # Süre-tavanı: varsayılan 300 sn sabitti; yazilim-fabrikasi/denetci.test.sh (15 mutant,
          # her biri TÜM süiti yeniden koşuyor) CI'da üst üste 300 sn'de Terminated oldu (2026-10-15,
          # ölç: #38724018436 vb. — 'bayat-kopya-geri-donusu' mutantında kesildi). Nexus'un
          # kabuk-testleri.sh'teki AYNI desen: ilk 15 satırda `# kabuk-testleri: sure=N` isteyen
          # sınama varsayılanı aşabilir, tavan 900 — istek kapıyı süresiz bekletmenin kılıfı olamaz.
          KABUK_SURE_VARSAYILAN=300; KABUK_SURE_TAVAN=900
          sure_sec(){
            local t="$1" n
            n="$(head -15 "$t" 2>/dev/null | sed -n 's/^# *kabuk-testleri: *sure=\([0-9]\{1,5\}\) *$/\1/p' | head -1)"
            if [ -z "$n" ] || [ "$n" -lt 1 ]; then echo "$KABUK_SURE_VARSAYILAN"; return 0; fi
            if [ "$n" -gt "$KABUK_SURE_TAVAN" ]; then echo "::warning::$t sure=$n istedi, tavan $KABUK_SURE_TAVAN uygulandı"; echo "$KABUK_SURE_TAVAN"; return 0; fi
            echo "$n"
          }
          # Arçelik sınavı aşağıdaki bağımsız işte koşar; burada ikinci kez çalıştırılmaz.
          mapfile -t T < <(find . -name '*.test.sh' -not -path './.git/*' -not -path './arcelik-fatura-kesim/scripts/kesim.test.sh' | sort)
          if [ "${#T[@]}" -eq 0 ]; then echo "::error::hiç *.test.sh bulunamadı — keşif bozuk"; exit 1; fi
          echo "bulunan sınama: ${#T[@]}"
          dusen=0; atlanan=0
          for t in "${T[@]}"; do
            case "$KARANTINA" in
              *" $t "*) echo "::warning::KARANTİNA — atlandı: $t"; atlanan=$((atlanan+1)); continue ;;
            esac
            echo "── $t"
            sure="$(sure_sec "$t")"
            if timeout "$sure" bash "$t"; then echo "   ✓ $t"; else echo "::error::$t KIRMIZI (süre tavanı ${sure}sn)"; dusen=$((dusen+1)); fi
          done
          echo "toplam=${#T[@]} koşan=$(( ${#T[@]} - atlanan )) atlanan=$atlanan düşen=$dusen"
          # karantina listesindeki bir dosya artık YOKSA liste bayatlamıştır → kırmızı
          for k in $KARANTINA; do
            [ -f "$k" ] || { echo "::error::karantina listesi bayat: $k artık yok"; dusen=$((dusen+1)); }
          done
          [ "$dusen" -eq 0 ]

  arcelik-fatura-kesim:
    name: arcelik-fatura-kesim sınavı
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: arcelik-fatura-kesim sınavı
        run: bash arcelik-fatura-kesim/scripts/kesim.test.sh
