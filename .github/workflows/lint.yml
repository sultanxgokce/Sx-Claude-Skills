# Sx-Claude-Skills lint-gate (Federe Ekip-OS D6/C2 — repo'nun İLK CI'ı)
# NE: manifest-katmanı kapısı — catalog↔install↔targets parity (validate-repo --strict) +
#     install'lı her skill'in SKILL.md + version-frontmatter taşıdığı.
# NE-DEĞİL: canlı-makine drift'i (o evergreen-parity cron-gate'inin işi — CI canlıyı göremez);
#     sync-apply de KOŞULMAZ (dağıtım elle-disiplin, ahi/DOCTRINE §8).
name: sx-lint
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: sx-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Parity · catalog ↔ sync-targets ↔ targets-varlığı (STRICT gate)"
        run: node ahi/schema/validate-repo.mjs . --strict
      - name: "Versiyon · install'lı her skill SKILL.md + semver-frontmatter taşır"
        run: node ahi/schema/version-lint.mjs .
      - name: "Motor · sync-skills.mjs sözdizimi"
        run: node --check sync-skills.mjs

      # Kabuk-sınamaları: 2026-07-30'a kadar depoda 20 adet `*.test.sh` vardı ve HİÇBİRİ
      # bir kapıda koşmuyordu — yazılmış ama bağlanmamış koruma. (Aynı sınıf cloudtop'ta da
      # ölçüldü.) Liste TÜRETİLİR, elle sayılmaz: yeni bir sınama eklendiği anda bu kapı onu
      # kendiliğinden koşar; sıfır sınama bulmak KIRMIZI'dır (keşif bozulursa sessizce
      # "hepsi geçti" demesin).
      - name: "Kabuk sınamaları · her *.test.sh (liste türetilir, sıfır bulmak kırmızı)"
        run: |
          set -uo pipefail
          # KARANTİNA — kapı ilk kez kurulurken KIRMIZI bulunan, bu PR'ın konusuyla İLGİSİZ
          # sınamalar. Sessiz atlama YASAK: her atlanan satır aşağıda ADIYLA ve GEREKÇESİYLE
          # loglanır, sayısı basılır. Karantina boşaltmak ayrı iştir (bulgu kaydı açıldı).
          #   mucit-t1.test.sh — 4 kapı (G10/G11 kota-tavanı · G17b/G18 layiha-üretimi) YALNIZ
          #   GitHub runner'ında düşüyor; üç yerel yapılandırmada (worktree · temiz klon ·
          #   LC_ALL=C) 39/39 geçiyor. Ortam-farkı henüz izole edilmedi; L24 MUCİT paketinin
          #   kendi işi (üreten≠işleten) → burada bodoslama düzeltilmiyor.
          #   kasif-hafiza.test.sh — TAKVİMLE ÇÜRÜYEN SINAV (ölçüldü 2026-08-23, PR #206).
          #   Kimsenin değişikliğinden kırılmadı: dosyaya en son #72'de dokunuldu. Ölçtüğü araç
          #   (kasif-karne.sh:39) KAYAN 30 GÜNLÜK pencere kullanıyor — `date -u -d "-30 days"` —
          #   ama sınavın fikstürü SABİT tarihler yazıyor (2026-07-01 · 07-25 · 07-26). Fikstür
          #   pencerenin dışına düşünce araç karne yerine "Henüz karne verilemez" basıyor ve
          #   metrik satırlarını arayan 5 iddia birden düşüyor (15 geçen / 5 düşen).
          #   → Gerçek onarım: fikstür tarihleri GÖRECELİ olsun ("bugünden N gün önce").
          #     Sahibi KAŞİF/MUCİT hattı; burada bodoslama düzeltilmiyor (üreten≠işleten).
          #   ⚠️ Bu, "yeşilin ne zamanki veriye ait olduğu sorulmuyor" sınıfının bir vakasıdır —
          #     kapı-sinavi becerisinin `bayat-mi` kapısının fikstür tarafındaki karşılığı.
          KARANTINA=" ./mucit-suz/scripts/mucit-t1.test.sh ./kasif-tara/scripts/kasif-hafiza.test.sh "
          mapfile -t T < <(find . -name '*.test.sh' -not -path './.git/*' | sort)
          if [ "${#T[@]}" -eq 0 ]; then echo "::error::hiç *.test.sh bulunamadı — keşif bozuk"; exit 1; fi
          echo "bulunan sınama: ${#T[@]}"
          dusen=0; atlanan=0
          for t in "${T[@]}"; do
            case "$KARANTINA" in
              *" $t "*) echo "::warning::KARANTİNA — atlandı: $t"; atlanan=$((atlanan+1)); continue ;;
            esac
            echo "── $t"
            if timeout 300 bash "$t"; then echo "   ✓ $t"; else echo "::error::$t KIRMIZI"; dusen=$((dusen+1)); fi
          done
          echo "toplam=${#T[@]} koşan=$(( ${#T[@]} - atlanan )) atlanan=$atlanan düşen=$dusen"
          # karantina listesindeki bir dosya artık YOKSA liste bayatlamıştır → kırmızı
          for k in $KARANTINA; do
            [ -f "$k" ] || { echo "::error::karantina listesi bayat: $k artık yok"; dusen=$((dusen+1)); }
          done
          [ "$dusen" -eq 0 ]
