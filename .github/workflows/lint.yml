# Sx-Claude-Skills lint-gate (Federe Ekip-OS D6/C2 — repo'nun İLK CI'ı)
# NE: manifest-katmanı kapısı — catalog↔install↔targets parity (validate-repo --strict) +
#     install'lı her skill'in SKILL.md + version-frontmatter taşıdığı.
# NE-DEĞİL: canlı-makine drift'i (o evergreen-parity cron-gate'inin işi — CI canlıyı göremez);
#     sync-apply de KOŞULMAZ (dağıtım elle-disiplin, ahi/DOCTRINE §8).
name: sx-lint
on:
  push:
    branches: [main]
  pull_request:
    # Yalnız kanıt / denetim / kart / el notu dosyası (_agents/) değiştiren PR'da CI hiç koşmaz: sınanacak kod yok. Kanca
    # (scripts/hooks/birlestirme-kapisi.sh) bu durumu GitHub'dan taze okuyup "CI gerekmez" der. SKILL.md ve diğer .md dosyaları
    # BİLEREK kapsam dışı: sürüm frontmatter'ı lint'in konusu.
    paths-ignore:
      - '_agents/**'

concurrency:
  group: sx-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Parity · catalog ↔ sync-targets ↔ targets-varlığı (STRICT gate)"
        run: node ahi/schema/validate-repo.mjs . --strict
      - name: "Versiyon · install'lı her skill SKILL.md + semver-frontmatter taşır"
        run: node ahi/schema/version-lint.mjs .
      - name: "Motor · sync-skills.mjs sözdizimi"
        run: node --check sync-skills.mjs

      # Kapı sınavı: aşağıdaki keşif adımı "sınavlar geçiyor mu" diye sorar. Bu adım
      # onun SORMADIĞI üç soruyu sorar: kapı DEVREDE mi (çağıran var mı) · modül
      # ÇAĞRILABİLİR mi (içe aktarınca donuyor mu) · defter TUTARLI mı.
      # 🔴 `kos` bilerek KOŞULMAZ — keşif adımı zaten aynı dosyaları koşuyor; iki kez
      #    koşmak sıfır yeni bilgi için çift maliyettir.
      # 🔴 `bayat-mi` de bilerek KOŞULMAZ — CI her seferinde TEMİZ ortamda başlar, yani
      #    "son yeşil koşum" damgası hiç var olmaz ve kapı DAİMA "ölçemedim" der. Daima
      #    sarı yanan kapı ya her şeyi bloklar ya görmezden gelinir; ikisi de tiyatrodur.
      #    Bayatlık YEREL/İNSAN kapısıdır ("ben geldiğimde bu yeşil güncel miydi?").
      # RC=3 (ÖLÇÜLEMEDİ) bu adımı DÜŞÜRÜR — ölçemediğimiz kapı temiz sayılmaz.
      - name: "Kapı sınavı · devrede mi · çağrılabilir mi (ÖLÇÜLEMEDİ = kırmızı)"
        run: |
          set -uo pipefail
          A=kapi-sinavi/scripts/kapi-sinavi.sh
          dusen=0
          for k in kayit bagli-mi ithal; do
            echo "── $k"
            bash "$A" "$k"; rc=$?
            case "$rc" in
              0) echo "   ✓ $k" ;;
              3) echo "::error::$k ÖLÇÜLEMEDİ (rc=3) — bu YEŞİL DEĞİLDİR"; dusen=$((dusen+1)) ;;
              *) echo "::error::$k BULGU/HATA (rc=$rc)"; dusen=$((dusen+1)) ;;
            esac
          done
          [ "$dusen" -eq 0 ]

  # Kabuk-sınamaları (her *.test.sh) ÜÇ kovada, üç ayrı runner'da koşar (duvar süresi en uzun kova): tek `for` döngüsü 41 dk sürüyordu
  # (ölçüm: CI #40003038870 — 139 sınama, 2493 sn; diploma 740 · denetci 598 · geri kalan ~1150). Liste hâlâ TÜRETİLİR, sıfır bulmak
  # hâlâ KIRMIZI, karantina hâlâ adıyla loglanır: hepsi .github/ci/kabuk-sinamalari.sh içinde (eski satır içi betiğin aynı sözleşmesi).
  kabuk:
    name: "kabuk sınamaları (${{ matrix.kova }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kova: [diploma, denetci, kalan]
    steps:
      - uses: actions/checkout@v4
      - name: "Kabuk sınamaları · ${{ matrix.kova }} kovası (liste türetilir, sıfır bulmak kırmızı)"
        run: bash .github/ci/kabuk-sinamalari.sh "${{ matrix.kova }}"

  arcelik-fatura-kesim:
    name: arcelik-fatura-kesim sınavı
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: arcelik-fatura-kesim sınavı
        run: bash arcelik-fatura-kesim/scripts/kesim.test.sh
