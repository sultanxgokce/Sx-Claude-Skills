<!DOCTYPE html><html><body>
<!-- ÇİFT-YÖNLÜ FİKSTÜRÜN YEŞİL YÜZÜ (bkz panel-kirmizi/, aynı sayfa yanlış yazımla)
     Gövdede 3 büyük sayı + panelde 3 büyük sayı. Bütçe yüzey başına 3'tür; panel AYRI
     yüzey sayıldığı için ikisi de bütçe İÇİNDE → rc=0 beklenir.

     ve burası kırmızıya döner. -->

<button style="background:#8a5a2b;border-radius:8px">Kaydet</button>
